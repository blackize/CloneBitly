version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bitly_postgres
    restart: always
    environment:
      POSTGRES_USER: bitly_user
      POSTGRES_PASSWORD: bitly_password
      POSTGRES_DB: bitly_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bitly_network

  redis:
    image: redis:7-alpine
    container_name: bitly_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - bitly_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitly_backend
    depends_on:
      - postgres
      - redis
    ports:
      - '3001:3001' # API port
    environment:
      DATABASE_URL: postgresql://bitly_user:bitly_password@postgres:5432/bitly_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
    networks:
      - bitly_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitly_frontend
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - bitly_network

volumes:
  postgres_data:
  redis_data:


networks:
  bitly_network:
    driver: bridge
